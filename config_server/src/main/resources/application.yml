spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/2023ayush/microservice-configs
          default-label: main

server:
  port: 8888

  instance:
    prefer-ip-address: true

eureka:
  client:
    enabled: false

logging:
  level:
    org.springframework.cloud.config.server: DEBUG
    org.eclipse.jgit: DEBUG
